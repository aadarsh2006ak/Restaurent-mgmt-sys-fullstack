<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D77F"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA771C"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1C24"/>
      <stop offset="100%" stop-color="#0B0C10"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#D4AF37" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Shield / Badge -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2"/>
  
  <!-- Admin Chef Hat / Crown & Utensils Emblem -->
  <g filter="url(#glow)">
    <!-- Chef Hat Base -->
    <path d="M20 40 L44 40 L42 45 L22 45 Z" fill="url(#goldGrad)"/>
    <rect x="22" y="36" width="20" height="3" rx="1.5" fill="url(#goldGrad)"/>
    
    <!-- Chef Hat Top Puffs -->
    <circle cx="23" cy="28" r="7" fill="url(#goldGrad)"/>
    <circle cx="32" cy="22" r="8.5" fill="url(#goldGrad)"/>
    <circle cx="41" cy="28" r="7" fill="url(#goldGrad)"/>
    <rect x="21" y="28" width="22" height="9" fill="url(#goldGrad)"/>
    
    <!-- Crown Stars on Base -->
    <circle cx="27" cy="42.5" r="1.5" fill="#1A1C24"/>
    <circle cx="32" cy="42.5" r="1.5" fill="#1A1C24"/>
    <circle cx="37" cy="42.5" r="1.5" fill="#1A1C24"/>
    
    <!-- Admin Sparkle Star at bottom -->
    <polygon points="32,49 33.5,52.5 37,53 34.5,55.5 35,59 32,57 29,59 29.5,55.5 27,53 30.5,52.5" fill="url(#goldGrad)"/>
  </g>
</svg>